name: Publicar noticias
on:
  schedule:
    - cron: "0 */3 * * *"   # cada 3 horas
  workflow_dispatch:        # botón para correrlo a mano
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python noticias.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: |
          git config user.name "aldiard-bot"
          git config user.email "bot@aldiard.com"
          git add docs
          git commit -m "Noticias $(date -u +%F_%H%M)" || echo "sin cambios"
          git push
