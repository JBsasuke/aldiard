name: Publicar noticias
on:
  schedule:
    - cron: "17 * * * *"    # cada hora (al minuto 17, que GitHub está menos lleno)
  workflow_dispatch:        # botón para correrlo a mano
permissions:
  contents: write
concurrency:
  group: noticias
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Buscar noticias y armar la página
        run: python noticias.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Subir la página
        run: |
          git config user.name "aldiard-bot"
          git config user.email "bot@aldiard.com"
          git add docs
          git commit -m "Noticias $(date -u +%F_%H%M)" || echo "sin cambios"
          git push
      - name: Publicar en Instagram
        run: python instagram.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - name: Guardar lo publicado
        run: |
          git add docs
          git commit -m "Instagram $(date -u +%F_%H%M)" || echo "sin cambios"
          git push
