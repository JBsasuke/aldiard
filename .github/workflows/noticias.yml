name: Publicar noticias
on:
  schedule:
    - cron: "17 * * * *"    # cada hora (al minuto 17, que GitHub está menos lleno)
  workflow_dispatch:        # botón para correrlo a mano
permissions:
  contents: write
concurrency:
  group: noticias
  cancel-in-progress: false
env:
  PROYECTO_CF: aldiard-web  # el proyecto de Cloudflare Pages con subida directa (no gasta el límite de 500)
jobs:
  # La corrida automática de GitHub (minuto 17) a veces llega muy tarde y cae justo detrás de la que
  # arranca el Worker de Cloudflare: si ya hubo una corrida hace menos de 40 minutos, no se repite.
  revisar:
    runs-on: ubuntu-latest
    outputs:
      correr: ${{ steps.ver.outputs.correr }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 10
      - id: ver
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "correr=si" >> "$GITHUB_OUTPUT"; exit 0; fi
          ULTIMA=$(git log -1 --format=%ct --grep='^Noticias ' || echo 0)
          MIN=$(( ( $(date +%s) - ${ULTIMA:-0} ) / 60 ))
          echo "La última corrida guardó noticias hace $MIN minutos"
          if [ "$MIN" -lt 40 ]; then echo "correr=no" >> "$GITHUB_OUTPUT"; echo "No hace falta correr otra vez"; else echo "correr=si" >> "$GITHUB_OUTPUT"; fi

  publicar:
    needs: revisar
    if: needs.revisar.outputs.correr == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 55     # si algo se traba, se corta (Instagram ahora sube hasta 5 por corrida)
    steps:
      # ref: main = lo último que hay en el repo (si no, una corrida que esperó en cola arranca con archivos viejos)
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Buscar noticias y armar la página
        run: python noticias.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Guardar la página en GitHub
        run: |
          git config user.name "aldiard-bot"
          git config user.email "bot@aldiard.com"
          rm -rf docs/fotos   # la página vieja de fotos (ahora es docs/fotosjb88)
          git add docs
          git commit -m "Noticias $(date -u +%F_%H%M)" || echo "sin cambios"
          # si mientras corría alguien subió un archivo al repo, se trae primero (si no, el push falla).
          # Si aun así choca (una noticia borrada en un lado y cambiada en el otro), se queda lo de esta corrida.
          if ! git pull --rebase -X theirs; then
            echo "Choque al juntar con lo que ya estaba: se queda lo de esta corrida"
            git add -A docs
            GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
          fi
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Subir la página directo a Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # quita espacios y saltos de línea que se cuelan al pegar los secretos
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          echo "Largo del token: ${#CLOUDFLARE_API_TOKEN} letras (debe ser unas 40) · Largo del ID de cuenta: ${#CLOUDFLARE_ACCOUNT_ID} (debe ser 32)"
          echo "Token: $([ -n "$CLOUDFLARE_API_TOKEN" ] && echo encontrado || echo NO ENCONTRADO) · Cuenta: $([ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo encontrada || echo NO ENCONTRADA)"
          # la primera vez crea el proyecto; si ya existe, avisa y se sigue
          npx --yes wrangler@4 pages project create "$PROYECTO_CF" --production-branch=main || echo "(el proyecto ya existe o no se pudo crear; se intenta subir igual)"
          npx --yes wrangler@4 pages deploy docs --project-name="$PROYECTO_CF" --branch=main --commit-dirty=true
      - name: Publicar en Instagram
        run: python instagram.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - name: Guardar lo publicado
        run: |
          git add docs
          git commit -m "Instagram $(date -u +%F_%H%M) [CF-Pages-Skip]" || echo "sin cambios"
          if ! git pull --rebase -X theirs; then
            echo "Choque al juntar con lo que ya estaba: se queda lo de esta corrida"
            git add -A docs
            GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
          fi
          git push
