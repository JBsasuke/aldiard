name: Publicar noticias
on:
  schedule:
    - cron: "17 * * * *"    # cada hora (al minuto 17, que GitHub está menos lleno)
  workflow_dispatch:        # botón para correrlo a mano
permissions:
  contents: write
concurrency:
  group: noticias
  cancel-in-progress: false
env:
  PROYECTO_CF: aldiard-web  # el proyecto de Cloudflare Pages con subida directa (no gasta el límite de 500)
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Buscar noticias y armar la página
        run: python noticias.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Guardar la página en GitHub
        run: |
          git config user.name "aldiard-bot"
          git config user.email "bot@aldiard.com"
          git add docs
          git commit -m "Noticias $(date -u +%F_%H%M)" || echo "sin cambios"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Subir la página directo a Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Token: $([ -n "$CLOUDFLARE_API_TOKEN" ] && echo encontrado || echo NO ENCONTRADO) · Cuenta: $([ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo encontrada || echo NO ENCONTRADA)"
          # la primera vez crea el proyecto; si ya existe, avisa y se sigue
          npx --yes wrangler@4 pages project create "$PROYECTO_CF" --production-branch=main || echo "(el proyecto ya existe o no se pudo crear; se intenta subir igual)"
          npx --yes wrangler@4 pages deploy docs --project-name="$PROYECTO_CF" --branch=main --commit-dirty=true
      - name: Publicar en Instagram
        run: python instagram.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - name: Guardar lo publicado
        run: |
          git add docs
          git commit -m "Instagram $(date -u +%F_%H%M) [CF-Pages-Skip]" || echo "sin cambios"
          git push
